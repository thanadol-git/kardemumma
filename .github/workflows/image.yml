name: image

# A new image on every push to main, and a versioned one for each release tag.
on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: kardemumma

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: imgname
        run: |
          echo "image=${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}/${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgname.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=pep440,pattern={{version}}
            type=sha,format=short

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the image
        run: |
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          for cmd in kardemumma-preview kardemumma-cutoff kardemumma-report kardemumma-ipynb kardemumma-docs; do
            docker run --rm "$tag" "$cmd" --help > /dev/null || { echo "::error::$cmd --help failed"; exit 1; }
            echo "ok: $cmd --help"
          done
          # As under docker run -u: another user, HOME=/, nothing writable but /tmp
          docker run --rm --read-only --tmpfs /tmp -u 1000:1000 "$tag" \
            python -c "import kardemumma, umap, matplotlib.pyplot"
          echo "ok: import as a non-root user on a read-only file system"
          docker run --rm -v "$PWD/tests:/work/tests:ro" "$tag" sh -c \
            "pip install --quiet pytest && python -m pytest -p no:cacheprovider tests"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
