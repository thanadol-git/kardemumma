name: Release Docs

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e . || true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate docs
        run: python generate_docs.py --out-dir dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "kardemumma ${{ github.ref_name }}"
          body: |
            ## API Reference

            Download the attached files for the full function reference:
            - `kardemumma_api.html` — interactive HTML (open in browser)
            - `kardemumma_api.pdf` — printable PDF
          files: |
            dist/kardemumma_api.html
            dist/kardemumma_api.pdf
